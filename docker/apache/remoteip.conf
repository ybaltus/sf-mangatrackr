# IP réelle du client derrière le reverse proxy (ADR 0016).
# TRUSTED_PROXIES vient de l'environnement du conteneur (env_file, défaut 127.0.0.1 de l'image) :
# une seule IP ou un CIDR ici, séparés par des espaces (pas de virgule).
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${TRUSTED_PROXIES}
