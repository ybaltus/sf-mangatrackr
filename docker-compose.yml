services:

  database:
    image: mariadb:${MARIADB_VERSION:-lts}
    container_name: mangatrackr_db
    restart: on-failure
    volumes:
      - db-data:/var/lib/mysql
      # Scripts exécutés à la première création du volume (base de test + droits)
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: ${DB_NAME:-sf_mangatrackr_app}
      MYSQL_USER: ${DB_USER:-mangatrackr}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMe}
    networks:
      - mangatrackr_network

  # PostgreSQL 18 (ADR 0012), en coexistence avec MariaDB jusqu'à la bascule (D6).
  # Le superutilisateur reste "postgres" ; le rôle applicatif (non superutilisateur), la base
  # principale et la base de test sont créés par les scripts de docker/postgres/init,
  # exécutés uniquement à la PREMIÈRE création du volume pg-data.
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: mangatrackr_pg
    restart: on-failure
    volumes:
      # Image 18 : le volume se monte sur /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker),
      # et non plus sur /var/lib/postgresql/data.
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-root1234}
      # Collation ICU "fr" pour template1 (bases créées ensuite, y compris par doctrine:database:create)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=fr"
      # Lus par les scripts d'init (alignés sur les variables du service database)
      APP_DB_NAME: ${DB_NAME:-sf_mangatrackr_app}
      APP_DB_USER: ${DB_USER:-mangatrackr}
      APP_DB_PASSWORD: ${DB_PASSWORD:-ChangeMe}
    healthcheck:
      # En TCP : le serveur temporaire de l'initialisation n'écoute que sur le socket Unix,
      # le service ne devient donc "healthy" qu'une fois les scripts d'init terminés.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mangatrackr_network

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: mangatrackr_app
    restart: on-failure
    ports:
      - "8080:80"
    depends_on:
      - database
      - postgres
    networks:
      - mangatrackr_network
    environment:
      # PostgreSQL 18 (ADR 0012) ; DATABASE_URL est composée dans .env à partir de DB_HOST/DB_PORT
      DB_HOST: postgres
      DB_PORT: 5432

networks:
  mangatrackr_network:

volumes:
  db-data:
  pg-data: